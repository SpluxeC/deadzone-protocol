name: Browser button and touch smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  interaction-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Start test server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/deadzone-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/deadzone-vite.log
          exit 1
      - name: Click and tap through game screens
        run: node scripts/ui-smoke.mjs
